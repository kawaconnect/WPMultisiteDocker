user  nginx;
worker_processes  auto;
worker_rlimit_nofile 8192;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens   off;

    client_max_body_size 300M;

    # Map forwarded proto for correct scheme in redirects and HTTPS detection
    map $http_x_forwarded_proto $real_scheme {
        https "https";
        default $scheme;
    }
    map $http_x_forwarded_proto $fastcgi_https {
        https "on";
        default "";
    }

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 4;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml
        font/ttf
        font/otf
        application/vnd.ms-fontobject;

    # Rate limiting for wp-login brute force protection
    limit_req_zone $binary_remote_addr zone=wp_login:10m rate=20r/m;
    limit_req_status 429;

    # Security headers (applied globally; re-included in locations that add their own headers)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "geolocation=(self), microphone=(), camera=()" always;
    add_header Content-Security-Policy "frame-ancestors 'self'" always;
    # Optional deployment headers (e.g. noindex for a standby stack).
    include /etc/nginx/wpops-http/*.conf;

    include /etc/nginx/conf.d/*.conf;
}
