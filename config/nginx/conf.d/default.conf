# =============================================================================
# WordPress Multisite (Subdirectory), Nginx Server Block
# =============================================================================
# server_name _ accepts ANY hostname.
# WordPress + SUNRISE domain mapping handles per-site routing.
# =============================================================================

upstream php-fpm {
    server wordpress:9000;
}

server {
    listen 80;
    server_name _;

    root /var/www/html;
    index index.php index.html;

    # -------------------------------------------------------------------------
    # Health check endpoint (used by Docker healthcheck)
    # -------------------------------------------------------------------------
    location = /nginx-health {
        access_log off;
        return 200 "OK\n";
    }

    # -------------------------------------------------------------------------
    # WordPress Multisite, subdirectory rewrites (per WordPress Codex)
    # -------------------------------------------------------------------------
    if (!-e $request_filename) {
        rewrite /wp-admin$ $real_scheme://$host$uri/ permanent;
        rewrite ^/[_0-9a-zA-Z-]+(/wp-.*) $1 last;
        rewrite ^/[_0-9a-zA-Z-]+(/.*\.php)$ $1 last;
    }

    # Legacy ms-files support
    rewrite ^/files/(.+) /wp-includes/ms-files.php?file=$1 last;

    # -------------------------------------------------------------------------
    # Security, deny access to sensitive files BEFORE .php processing
    # -------------------------------------------------------------------------
    location = /wp-config.php {
        deny all;
    }

    location ~* /(?:xmlrpc|wp-trackback)\.php$ {
        deny all;
    }

    location ~* /wp-includes/.*\.php$ {
        deny all;
    }

    location ~* /wp-content/uploads/.*\.php$ {
        deny all;
    }

    # Deny access to hidden files (except .well-known)
    location ~ /\.(?!well-known) {
        deny all;
    }

    # -------------------------------------------------------------------------
    # Static files, serve directly, long cache
    # -------------------------------------------------------------------------
    # NOTE: No add_header here, inherits security headers from http{} block.
    # Using expires directive which does not break header inheritance.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2?|ttf|eot|otf|mp4|webm)$ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    # -------------------------------------------------------------------------
    # Main location, WP front controller
    # -------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # -------------------------------------------------------------------------
    # PHP-FPM processing
    # -------------------------------------------------------------------------
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass php-fpm;
        fastcgi_index index.php;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        # Pass the original Host header for domain mapping
        fastcgi_param HTTP_HOST $host;
        fastcgi_param SERVER_NAME $host;

        # HTTPS detection behind Cloudflare / reverse proxy
        fastcgi_param HTTPS $fastcgi_https if_not_empty;

        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_read_timeout 300;
        fastcgi_intercept_errors on;
    }

    # -------------------------------------------------------------------------
    # Misc
    # -------------------------------------------------------------------------
    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }

    location = /robots.txt {
        log_not_found off;
        access_log off;
        allow all;
    }
}
