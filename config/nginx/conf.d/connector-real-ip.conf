# =============================================================================
# Cloudflare tunnel connectors, Restore Real Visitor IP
# =============================================================================
# Tunnel traffic reaches Nginx from the cloudflared connectors over the
# wpops-edge network, which wpops creates as 10.214.255.0/24 (see
# EDGE_SUBNET in scripts/wpops/wpops/stacks.py). Only addresses on that
# network may supply CF-Connecting-IP (real_ip_header, in
# cloudflare-real-ip.conf), so the wp_login rate limit is kept per visitor
# instead of one bucket shared by everyone behind the connector.
#
# Only the connectors and each stack's Nginx sit on wpops-edge: WordPress,
# WP-CLI, MariaDB and Redis do not, so PHP code cannot claim another IP.
# The gateway 10.214.255.1 is left out on purpose: requests sent to the
# loopback-published port (127.0.0.1:HTTP_PORT) or from the host arrive
# from it, and keep their own address.
#
# Legacy root stack (nginx on <project>_frontend, a Docker-assigned subnet):
# see docs/deployments.md, "Visitor IPs behind the tunnel".
# =============================================================================

set_real_ip_from 10.214.255.2/31;
set_real_ip_from 10.214.255.4/30;
set_real_ip_from 10.214.255.8/29;
set_real_ip_from 10.214.255.16/28;
set_real_ip_from 10.214.255.32/27;
set_real_ip_from 10.214.255.64/26;
set_real_ip_from 10.214.255.128/25;
