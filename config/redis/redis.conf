# =============================================================================
# Redis Configuration, WordPress Object Cache
# =============================================================================

# Memory
maxmemory 384mb
maxmemory-policy allkeys-lru

# Cache resilience, don't stop writes if background save fails
stop-writes-on-bgsave-error no

# Persistence, lightweight RDB snapshots
save 900 1
save 300 10
save 60 10000
dbfilename dump.rdb
dir /data

# Network
bind 0.0.0.0
port 6379
tcp-keepalive 300
timeout 0

# Logging
loglevel notice
