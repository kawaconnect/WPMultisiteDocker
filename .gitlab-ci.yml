# GitLab CI for WPMultisiteDocker.
#
#   test     -> offline deployment tests (tests/), php -l on the deployment PHP,
#               bash -n on the Cloudflare scripts. The Compose checks use the
#               Docker CLI and Compose plugin only (`compose config`), no daemon.
#   release  -> GitLab release for a v* tag, with its CHANGELOG.md section as
#               the notes. This repo has no build artifact.
#
# Runs on v* tags, when started from the web UI / API, and on merge requests.

stages: [test, release]

workflow:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "api"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

variables:
  GIT_DEPTH: "1"
  DOCKER_CLI_VERSION: "29.9.2"
  COMPOSE_VERSION: "v5.6.1"

.linux:
  tags: [linux]
  interruptible: true

test:
  extends: .linux
  stage: test
  image: python:3.12-slim-bookworm
  script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends php-cli jq curl ca-certificates >/dev/null
    - mkdir -p "$HOME/.docker/cli-plugins"
    - curl -fsSL "https://download.docker.com/linux/static/stable/x86_64/docker-${DOCKER_CLI_VERSION}.tgz" | tar xz -C /usr/local/bin --strip-components=1 docker/docker
    - curl -fsSL -o "$HOME/.docker/cli-plugins/docker-compose" "https://github.com/docker/compose/releases/download/${COMPOSE_VERSION}/docker-compose-linux-x86_64"
    - chmod +x "$HOME/.docker/cli-plugins/docker-compose" && docker compose version
    - python3 -m unittest discover -s tests -v
    - find config/php plugin -name '*.php' -print0 | xargs -0 -n1 php -l
    - for f in scripts/*.sh scripts/wpops/install-agent.sh; do bash -n "$f"; done

release:
  extends: .linux
  stage: release
  image: alpine:3.23
  needs: [test]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
  interruptible: false
  script:
    - apk add --no-cache curl jq >/dev/null
    - |
      VERSION="${CI_COMMIT_TAG#v}"
      API="$CI_API_V4_URL/projects/$CI_PROJECT_ID"
      NOTES=$(awk -v v="## [$VERSION]" 'index($0, v) == 1 {on=1; next} /^## / && on {exit} on' CHANGELOG.md)
      [ -n "$NOTES" ] || NOTES="Version $VERSION"
      if curl -fsS -o /dev/null -H "JOB-TOKEN: $CI_JOB_TOKEN" "$API/releases/$CI_COMMIT_TAG"; then
        jq -cn --arg d "$NOTES" '{description:$d}' | curl -fsS -X PUT -H "JOB-TOKEN: $CI_JOB_TOKEN" -H "Content-Type: application/json" "$API/releases/$CI_COMMIT_TAG" -d @- | jq -r '"updated release " + .tag_name'
      else
        jq -cn --arg t "$CI_COMMIT_TAG" --arg n "WPMultisiteDocker $VERSION" --arg d "$NOTES" '{tag_name:$t, name:$n, description:$d}' | curl -fsS -X POST -H "JOB-TOKEN: $CI_JOB_TOKEN" -H "Content-Type: application/json" "$API/releases" -d @- | jq -r '"created release " + .tag_name'
      fi
