# =============================================================================
# WordPress Multisite, Docker Compose
# =============================================================================
# Core services:   docker compose up -d
# With tunnels:    docker compose --profile tunnels up -d
# =============================================================================

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true

services:
  # ---------------------------------------------------------------------------
  # MariaDB 11.8 LTS
  # ---------------------------------------------------------------------------
  mariadb:
    image: mariadb:11.8.9
    restart: unless-stopped
    networks:
      - backend
    volumes:
      - ./data/mysql:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      # Run mariadb-upgrade automatically after an image bump (11.4 -> 11.8 etc.)
      MARIADB_AUTO_UPGRADE: "1"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      # The entrypoint hands a new ./data/mysql (created by Docker as root) to mysql.
      - CHOWN
      - FOWNER
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 1G

  # ---------------------------------------------------------------------------
  # Redis 8, Object Cache
  # ---------------------------------------------------------------------------
  redis:
    image: redis:8.10-alpine
    restart: unless-stopped
    networks:
      - backend
    volumes:
      - ./data/redis:/data
      - ./config/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    # The password goes to redis-server on stdin ("-" = read the config from
    # stdin; it includes redis.conf), not on its command line: it is not in
    # `docker inspect` Args, the healthcheck definition or the host's process
    # list. "-" must be the first argument: the image's entrypoint appends
    # --loadmodule options after it.
    entrypoint:
      - /bin/sh
      - -c
      - |
        p=$$(printf '%s' "$$REDIS_PASSWORD" | sed 's/[\\"]/\\&/g')
        exec docker-entrypoint.sh redis-server - <<EOF
        include /usr/local/etc/redis/redis.conf
        requirepass "$$p"
        EOF
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      # Hands a new ./data/redis to redis; without it RDB saves fail and
      # stop-writes-on-bgsave-error rejects every write.
      - CHOWN
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M

  # ---------------------------------------------------------------------------
  # WordPress 7, PHP-FPM (PHP 8.3, matching the primary)
  # ---------------------------------------------------------------------------
  # NOTE: $$ is docker-compose YAML escaping for a literal $ in the container
  wordpress:
    image: wordpress:7.1.5-php8.3-fpm
    restart: unless-stopped
    networks:
      - frontend
      - backend
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data/wordpress:/var/www/html
      - ./config/php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
    environment:
      WORDPRESS_DB_HOST: ${WORDPRESS_DB_HOST}
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD}
      WORDPRESS_TABLE_PREFIX: ${WORDPRESS_TABLE_PREFIX}
      # Settings reach PHP through the environment (getenv), never pasted into
      # the PHP source: a quote or backslash in .env cannot break or inject
      # into wp-config.php.
      WP_MODE: ${WP_MODE:-multisite}
      WP_SUBDOMAIN_INSTALL: ${WP_SUBDOMAIN_INSTALL:-true}
      WP_DOMAIN_CURRENT_SITE: ${WP_DOMAIN_CURRENT_SITE:-localhost}
      WP_SUNRISE: ${WP_SUNRISE:-false}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      WORDPRESS_CONFIG_EXTRA: &wp_config_extra |
        /* Multisite, always allow, activate only when DB tables exist */
        if ((getenv('WP_MODE') ?: 'multisite') === 'multisite') {
        define('WP_ALLOW_MULTISITE', true);

        /* Detect if multisite tables are present (e.g. after DB sync from production) */
        if (defined('DB_NAME') && defined('DB_USER') && defined('DB_PASSWORD') && defined('DB_HOST')) {
            try {
                $$__ms_prev = mysqli_report(MYSQLI_REPORT_OFF);
                $$__ms_check = new mysqli(
                    explode(':', DB_HOST)[0],
                    DB_USER,
                    DB_PASSWORD,
                    DB_NAME,
                    (int)(explode(':', DB_HOST)[1] ?? 3306)
                );
                mysqli_report($$__ms_prev);
                if (!$$__ms_check->connect_error) {
                    $$__ms_prefix = isset($$table_prefix) ? $$table_prefix : 'wp_';
                    $$__ms_result = $$__ms_check->query("SHOW TABLES LIKE '" . $$__ms_check->real_escape_string($$__ms_prefix) . "blogs'");
                    if ($$__ms_result && $$__ms_result->num_rows > 0) {
                        define('MULTISITE', true);
                        define('SUBDOMAIN_INSTALL', getenv('WP_SUBDOMAIN_INSTALL') !== 'false');
                        define('DOMAIN_CURRENT_SITE', getenv('WP_DOMAIN_CURRENT_SITE') ?: 'localhost');
                        define('PATH_CURRENT_SITE', '/');
                        define('SITE_ID_CURRENT_SITE', 1);
                        define('BLOG_ID_CURRENT_SITE', 1);
                        if (getenv('WP_SUNRISE') === 'true') {
                            define('SUNRISE', true);
                        }
                    }
                    if ($$__ms_result) $$__ms_result->free();
                }
            } catch (Exception $$__ms_e) {
                /* DB unreachable, skip multisite activation */
            } finally {
                if (isset($$__ms_check) && $$__ms_check instanceof mysqli && !$$__ms_check->connect_error) {
                    $$__ms_check->close();
                }
            }
        }

        }

        /* Redis object cache */
        define('WP_REDIS_HOST', getenv('REDIS_HOST') ?: 'redis');
        define('WP_REDIS_PORT', (int) (getenv('REDIS_PORT') ?: 6379));
        define('WP_REDIS_PASSWORD', getenv('REDIS_PASSWORD'));

        /* Disable built-in cron, external container handles it */
        define('DISABLE_WP_CRON', true);

        /* Reverse proxy / Cloudflare */
        if (isset($$_SERVER['HTTP_X_FORWARDED_PROTO']) && $$_SERVER['HTTP_X_FORWARDED_PROTO'] === 'https') {
            $$_SERVER['HTTPS'] = 'on';
        }
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/9000'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - CHOWN
      - FOWNER
      # php-fpm runs as root and signals its www-data workers: without KILL a
      # reload (USR2) never finishes and every stop waits for a force kill.
      - KILL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 1G

  # ---------------------------------------------------------------------------
  # Nginx 1.31, Reverse Proxy + Static Files
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:1.31.9-alpine
    restart: unless-stopped
    networks:
      - frontend
      - backend
    depends_on:
      wordpress:
        condition: service_healthy
    ports:
      # Loopback only: the tunnels reach nginx over the docker network, nothing on the LAN needs it
      - "127.0.0.1:8080:80"
    volumes:
      - ./data/wordpress:/var/www/html:ro
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./config/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./logs/nginx:/var/log/nginx
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1/nginx-health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - SETUID
      - SETGID
      - CHOWN
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 256M

  # ---------------------------------------------------------------------------
  # WP-Cron, runs every 5 minutes via WP-CLI
  # ---------------------------------------------------------------------------
  wp-cron:
    image: wordpress:cli-2.12
    restart: unless-stopped
    user: "33:33"
    networks:
      - backend
      # Not only the internal network: there, names Docker cannot answer get
      # SERVFAIL, and musl then stops at the host's search domain before
      # trying "mariadb" itself (same as the managed stack template).
      - frontend
    depends_on:
      wordpress:
        condition: service_healthy
    volumes:
      - ./data/wordpress:/var/www/html
      # Pulled backup sets (wpops), read-only; `wp siteguardbackup import /backups/<source>/<set>/`
      - ./backups:/backups:ro
    environment:
      WORDPRESS_DB_HOST: ${WORDPRESS_DB_HOST}
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD}
      WORDPRESS_TABLE_PREFIX: ${WORDPRESS_TABLE_PREFIX}
      WP_MODE: ${WP_MODE:-multisite}
      WP_SUBDOMAIN_INSTALL: ${WP_SUBDOMAIN_INSTALL:-true}
      WP_DOMAIN_CURRENT_SITE: ${WP_DOMAIN_CURRENT_SITE:-localhost}
      WP_SUNRISE: ${WP_SUNRISE:-false}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      WORDPRESS_CONFIG_EXTRA: *wp_config_extra
    entrypoint: /bin/sh
    command:
      - -c
      - |
        while true; do
          wp cron event run --due-now --path=/var/www/html 2>&1 || true
          sleep 60
        done
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 1G  # restores copy/extract multi-hundred-MB archives through WP-CLI

  # ---------------------------------------------------------------------------
  # Cloudflare DNS Backup, runs every 6 hours, saves on change
  # ---------------------------------------------------------------------------
  cf-backup:
    # Built once from docker/cf-backup (bash, curl, jq on a pinned Alpine);
    # nothing is installed at start. Sees only the CF_* settings it needs
    # (not the whole .env) and runs without capabilities on a read-only root.
    build: ./docker/cf-backup
    image: wpops-cf-backup:local
    restart: unless-stopped
    networks:
      - frontend
    volumes:
      - ./scripts:/app/scripts:ro
      - ./config:/app/config:ro
      - ./data/cloudflare/backups:/app/data/cloudflare/backups
    # Only the Cloudflare settings (accounts 1-10), interpolated from .env.
    environment:
      CF_STANDBY_DOMAIN: ${CF_STANDBY_DOMAIN:-}
      CF_CLOUD_IP: ${CF_CLOUD_IP:-}
      CF_API_URL: ${CF_API_URL:-}
      CF_ACCOUNT_1_NAME: ${CF_ACCOUNT_1_NAME:-}
      CF_ACCOUNT_1_ID: ${CF_ACCOUNT_1_ID:-}
      CF_ACCOUNT_1_TOKEN: ${CF_ACCOUNT_1_TOKEN:-}
      CF_ACCOUNT_1_STANDBY: ${CF_ACCOUNT_1_STANDBY:-}
      CF_ACCOUNT_1_DOMAINS: ${CF_ACCOUNT_1_DOMAINS:-}
      CF_ACCOUNT_2_NAME: ${CF_ACCOUNT_2_NAME:-}
      CF_ACCOUNT_2_ID: ${CF_ACCOUNT_2_ID:-}
      CF_ACCOUNT_2_TOKEN: ${CF_ACCOUNT_2_TOKEN:-}
      CF_ACCOUNT_2_STANDBY: ${CF_ACCOUNT_2_STANDBY:-}
      CF_ACCOUNT_2_DOMAINS: ${CF_ACCOUNT_2_DOMAINS:-}
      CF_ACCOUNT_3_NAME: ${CF_ACCOUNT_3_NAME:-}
      CF_ACCOUNT_3_ID: ${CF_ACCOUNT_3_ID:-}
      CF_ACCOUNT_3_TOKEN: ${CF_ACCOUNT_3_TOKEN:-}
      CF_ACCOUNT_3_STANDBY: ${CF_ACCOUNT_3_STANDBY:-}
      CF_ACCOUNT_3_DOMAINS: ${CF_ACCOUNT_3_DOMAINS:-}
      CF_ACCOUNT_4_NAME: ${CF_ACCOUNT_4_NAME:-}
      CF_ACCOUNT_4_ID: ${CF_ACCOUNT_4_ID:-}
      CF_ACCOUNT_4_TOKEN: ${CF_ACCOUNT_4_TOKEN:-}
      CF_ACCOUNT_4_STANDBY: ${CF_ACCOUNT_4_STANDBY:-}
      CF_ACCOUNT_4_DOMAINS: ${CF_ACCOUNT_4_DOMAINS:-}
      CF_ACCOUNT_5_NAME: ${CF_ACCOUNT_5_NAME:-}
      CF_ACCOUNT_5_ID: ${CF_ACCOUNT_5_ID:-}
      CF_ACCOUNT_5_TOKEN: ${CF_ACCOUNT_5_TOKEN:-}
      CF_ACCOUNT_5_STANDBY: ${CF_ACCOUNT_5_STANDBY:-}
      CF_ACCOUNT_5_DOMAINS: ${CF_ACCOUNT_5_DOMAINS:-}
      CF_ACCOUNT_6_NAME: ${CF_ACCOUNT_6_NAME:-}
      CF_ACCOUNT_6_ID: ${CF_ACCOUNT_6_ID:-}
      CF_ACCOUNT_6_TOKEN: ${CF_ACCOUNT_6_TOKEN:-}
      CF_ACCOUNT_6_STANDBY: ${CF_ACCOUNT_6_STANDBY:-}
      CF_ACCOUNT_6_DOMAINS: ${CF_ACCOUNT_6_DOMAINS:-}
      CF_ACCOUNT_7_NAME: ${CF_ACCOUNT_7_NAME:-}
      CF_ACCOUNT_7_ID: ${CF_ACCOUNT_7_ID:-}
      CF_ACCOUNT_7_TOKEN: ${CF_ACCOUNT_7_TOKEN:-}
      CF_ACCOUNT_7_STANDBY: ${CF_ACCOUNT_7_STANDBY:-}
      CF_ACCOUNT_7_DOMAINS: ${CF_ACCOUNT_7_DOMAINS:-}
      CF_ACCOUNT_8_NAME: ${CF_ACCOUNT_8_NAME:-}
      CF_ACCOUNT_8_ID: ${CF_ACCOUNT_8_ID:-}
      CF_ACCOUNT_8_TOKEN: ${CF_ACCOUNT_8_TOKEN:-}
      CF_ACCOUNT_8_STANDBY: ${CF_ACCOUNT_8_STANDBY:-}
      CF_ACCOUNT_8_DOMAINS: ${CF_ACCOUNT_8_DOMAINS:-}
      CF_ACCOUNT_9_NAME: ${CF_ACCOUNT_9_NAME:-}
      CF_ACCOUNT_9_ID: ${CF_ACCOUNT_9_ID:-}
      CF_ACCOUNT_9_TOKEN: ${CF_ACCOUNT_9_TOKEN:-}
      CF_ACCOUNT_9_STANDBY: ${CF_ACCOUNT_9_STANDBY:-}
      CF_ACCOUNT_9_DOMAINS: ${CF_ACCOUNT_9_DOMAINS:-}
      CF_ACCOUNT_10_NAME: ${CF_ACCOUNT_10_NAME:-}
      CF_ACCOUNT_10_ID: ${CF_ACCOUNT_10_ID:-}
      CF_ACCOUNT_10_TOKEN: ${CF_ACCOUNT_10_TOKEN:-}
      CF_ACCOUNT_10_STANDBY: ${CF_ACCOUNT_10_STANDBY:-}
      CF_ACCOUNT_10_DOMAINS: ${CF_ACCOUNT_10_DOMAINS:-}
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 128M

  # ---------------------------------------------------------------------------
  # Cloudflare Tunnels
  # ---------------------------------------------------------------------------
  # Tunnel services are auto-generated in docker-compose.tunnels.yml
  # by ./scripts/cf-setup.sh. Do not add cloudflared services here.
  #
  # Setup:   ./scripts/cf-setup.sh
  # Start:   docker compose --profile tunnels up -d
  # Status:  ./scripts/cf-status.sh
  # ---------------------------------------------------------------------------
