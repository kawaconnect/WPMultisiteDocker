# =============================================================================
# WordPress Multisite, Docker Compose
# =============================================================================
# Core services:   docker compose up -d
# With tunnels:    docker compose --profile tunnels up -d
# =============================================================================

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true

services:
  # ---------------------------------------------------------------------------
  # MariaDB 11.4 LTS
  # ---------------------------------------------------------------------------
  mariadb:
    image: mariadb:11.4.4
    restart: unless-stopped
    networks:
      - backend
    volumes:
      - ./data/mysql:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 1G

  # ---------------------------------------------------------------------------
  # Redis 7, Object Cache
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    networks:
      - backend
    volumes:
      - ./data/redis:/data
      - ./config/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: redis-server /usr/local/etc/redis/redis.conf --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M

  # ---------------------------------------------------------------------------
  # WordPress 6, PHP-FPM
  # ---------------------------------------------------------------------------
  # NOTE: $$ is docker-compose YAML escaping for a literal $ in the container
  wordpress:
    image: wordpress:6.9.4-fpm
    restart: unless-stopped
    networks:
      - frontend
      - backend
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data/wordpress:/var/www/html
      - ./config/php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
    environment:
      WORDPRESS_DB_HOST: ${WORDPRESS_DB_HOST}
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD}
      WORDPRESS_TABLE_PREFIX: ${WORDPRESS_TABLE_PREFIX}
      WORDPRESS_CONFIG_EXTRA: |
        /* Multisite, always allow, activate only when DB tables exist */
        define('WP_ALLOW_MULTISITE', true);

        /* Detect if multisite tables are present (e.g. after DB sync from production) */
        if (defined('DB_NAME') && defined('DB_USER') && defined('DB_PASSWORD') && defined('DB_HOST')) {
            try {
                $$__ms_prev = mysqli_report(MYSQLI_REPORT_OFF);
                $$__ms_check = new mysqli(
                    explode(':', DB_HOST)[0],
                    DB_USER,
                    DB_PASSWORD,
                    DB_NAME,
                    (int)(explode(':', DB_HOST)[1] ?? 3306)
                );
                mysqli_report($$__ms_prev);
                if (!$$__ms_check->connect_error) {
                    $$__ms_prefix = isset($$table_prefix) ? $$table_prefix : 'wp_';
                    $$__ms_result = $$__ms_check->query("SHOW TABLES LIKE '" . $$__ms_check->real_escape_string($$__ms_prefix) . "blogs'");
                    if ($$__ms_result && $$__ms_result->num_rows > 0) {
                        define('MULTISITE', true);
                        define('SUBDOMAIN_INSTALL', ${WP_SUBDOMAIN_INSTALL});
                        define('DOMAIN_CURRENT_SITE', '${WP_DOMAIN_CURRENT_SITE}');
                        define('PATH_CURRENT_SITE', '/');
                        define('SITE_ID_CURRENT_SITE', 1);
                        define('BLOG_ID_CURRENT_SITE', 1);
                        if ('${WP_SUNRISE}' === 'true') {
                            define('SUNRISE', true);
                        }
                    }
                    if ($$__ms_result) $$__ms_result->free();
                }
            } catch (Exception $$__ms_e) {
                /* DB unreachable, skip multisite activation */
            } finally {
                if (isset($$__ms_check) && $$__ms_check instanceof mysqli && !$$__ms_check->connect_error) {
                    $$__ms_check->close();
                }
            }
        }

        /* Redis object cache */
        define('WP_REDIS_HOST', '${REDIS_HOST}');
        define('WP_REDIS_PORT', ${REDIS_PORT});
        define('WP_REDIS_PASSWORD', '${REDIS_PASSWORD}');

        /* Disable built-in cron, external container handles it */
        define('DISABLE_WP_CRON', true);

        /* Reverse proxy / Cloudflare */
        if (isset($$_SERVER['HTTP_X_FORWARDED_PROTO']) && $$_SERVER['HTTP_X_FORWARDED_PROTO'] === 'https') {
            $$_SERVER['HTTPS'] = 'on';
        }
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/9000'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - CHOWN
      - FOWNER
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 1G

  # ---------------------------------------------------------------------------
  # Nginx 1.27, Reverse Proxy + Static Files
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:1.29.8-alpine
    restart: unless-stopped
    networks:
      - frontend
      - backend
    depends_on:
      wordpress:
        condition: service_healthy
    ports:
      - "8080:80"
    volumes:
      - ./data/wordpress:/var/www/html:ro
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./config/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./logs/nginx:/var/log/nginx
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1/nginx-health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - SETUID
      - SETGID
      - CHOWN
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 256M

  # ---------------------------------------------------------------------------
  # WP-Cron, runs every 5 minutes via WP-CLI
  # ---------------------------------------------------------------------------
  wp-cron:
    image: wordpress:cli-2.12
    restart: unless-stopped
    user: "33:33"
    networks:
      - backend
    depends_on:
      wordpress:
        condition: service_healthy
    volumes:
      - ./data/wordpress:/var/www/html
      # Pulled backup sets (wpops), read-only; `wp siteguardbackup import /backups/<source>/<set>/`
      - ./backups:/backups:ro
    environment:
      WORDPRESS_DB_HOST: ${WORDPRESS_DB_HOST}
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD}
      WORDPRESS_TABLE_PREFIX: ${WORDPRESS_TABLE_PREFIX}
    entrypoint: /bin/sh
    command:
      - -c
      - |
        while true; do
          wp cron event run --due-now --path=/var/www/html 2>&1 || true
          sleep 60
        done
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 256M

  # ---------------------------------------------------------------------------
  # Cloudflare DNS Backup, runs every 6 hours, saves on change
  # ---------------------------------------------------------------------------
  cf-backup:
    image: alpine:3.23
    restart: unless-stopped
    networks:
      - frontend
    volumes:
      - ./scripts:/app/scripts:ro
      - ./data/cloudflare/backups:/app/data/cloudflare/backups
      - ./.env:/app/.env:ro
    entrypoint: /bin/sh
    command:
      - -c
      - |
        apk add --no-cache bash curl jq openssl >/dev/null 2>&1
        ln -sf /bin/true /usr/local/bin/docker
        while true; do
          bash /app/scripts/cf-backup.sh 2>&1 || true
          sleep 21600
        done
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 128M

  # ---------------------------------------------------------------------------
  # Cloudflare Tunnels
  # ---------------------------------------------------------------------------
  # Tunnel services are auto-generated in docker-compose.tunnels.yml
  # by ./scripts/cf-setup.sh. Do not add cloudflared services here.
  #
  # Setup:   ./scripts/cf-setup.sh
  # Start:   docker compose --profile tunnels up -d
  # Status:  ./scripts/cf-status.sh
  # ---------------------------------------------------------------------------
