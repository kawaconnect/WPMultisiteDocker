  #     - frontend
  #   command: tunnel --no-autoupdate run
  #   environment:
  #     TUNNEL_TOKEN: ${CF_TUNNEL_ACCOUNT2}
  #   deploy:
  #     resources:
  #       limits:
  #         memory: 128M

