# =============================================================================
# WordPress Multisite, Docker Compose
# =============================================================================
# Core services:   docker compose up -d
# With tunnels:    docker compose --profile tunnels up -d
# =============================================================================

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true

services:
  # ---------------------------------------------------------------------------
  # MariaDB 11.4 LTS
  # ---------------------------------------------------------------------------
  mariadb:
    image: mariadb:11.4
    restart: unless-stopped
    networks:
      - backend
    volumes:
      - ./data/mysql:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1G

  # ---------------------------------------------------------------------------
  # Redis 7, Object Cache
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - backend
    volumes:
      - ./data/redis:/data
      - ./config/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: redis-server /usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M

  # ---------------------------------------------------------------------------
  # WordPress 6, PHP-FPM
  # ---------------------------------------------------------------------------
  wordpress:
    image: wordpress:6-fpm
    restart: unless-stopped
    networks:
      - frontend
      - backend
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data/wordpress:/var/www/html
      - ./config/php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro
    environment:
      WORDPRESS_DB_HOST: ${WORDPRESS_DB_HOST}
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD}
      WORDPRESS_TABLE_PREFIX: ${WORDPRESS_TABLE_PREFIX}
      WORDPRESS_CONFIG_EXTRA: |
        /* Multisite, always allow, activate only when DB tables exist */
        define('WP_ALLOW_MULTISITE', true);

        /* Detect if multisite tables are present (e.g. after DB sync from production) */
        if (defined('DB_NAME') && defined('DB_USER') && defined('DB_PASSWORD') && defined('DB_HOST')) {
            try {
                $$__ms_prev = mysqli_report(MYSQLI_REPORT_OFF);
                $$__ms_check = new mysqli(
                    explode(':', DB_HOST)[0],
                    DB_USER,
                    DB_PASSWORD,
                    DB_NAME,
                    (int)(explode(':', DB_HOST)[1] ?? 3306)
                );
                mysqli_report($$__ms_prev);
                if (!$$__ms_check->connect_error) {
                    $$__ms_result = $$__ms_check->query("SHOW TABLES LIKE '" . (isset($$table_prefix) ? $$table_prefix : 'wp_') . "blogs'");
                    if ($$__ms_result && $$__ms_result->num_rows > 0) {
                        define('MULTISITE', true);
                        define('SUBDOMAIN_INSTALL', ${WP_SUBDOMAIN_INSTALL});
                        define('DOMAIN_CURRENT_SITE', '${WP_DOMAIN_CURRENT_SITE}');
                        define('PATH_CURRENT_SITE', '/');
                        define('SITE_ID_CURRENT_SITE', 1);
                        define('BLOG_ID_CURRENT_SITE', 1);
                        if ('${WP_SUNRISE}' === 'true') {
                            define('SUNRISE', true);
                        }
                    }
                    if ($$__ms_result) $$__ms_result->free();
                    $$__ms_check->close();
                }
            } catch (Exception $$__ms_e) {
                /* DB unreachable, skip multisite activation */
            }
        }

        /* Redis object cache */
        define('WP_REDIS_HOST', '${REDIS_HOST}');
        define('WP_REDIS_PORT', ${REDIS_PORT});

        /* Disable built-in cron, external container handles it */
        define('DISABLE_WP_CRON', true);

        /* Reverse proxy / Cloudflare */
        if (isset($$_SERVER['HTTP_X_FORWARDED_PROTO']) && $$_SERVER['HTTP_X_FORWARDED_PROTO'] === 'https') {
            $$_SERVER['HTTPS'] = 'on';
        }
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G

  # ---------------------------------------------------------------------------
  # Nginx 1.27, Reverse Proxy + Static Files
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    networks:
      - frontend
      - backend
    depends_on:
      wordpress:
        condition: service_healthy
    ports:
      - "8080:80"
    volumes:
      - ./data/wordpress:/var/www/html:ro
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./config/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./logs/nginx:/var/log/nginx
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1/nginx-health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 256M

  # ---------------------------------------------------------------------------
  # WP-Cron, runs every 5 minutes via WP-CLI
  # ---------------------------------------------------------------------------
  wp-cron:
    image: wordpress:cli
    restart: unless-stopped
    user: "33:33"
    networks:
      - backend
    depends_on:
      wordpress:
        condition: service_healthy
    volumes:
      - ./data/wordpress:/var/www/html
    environment:
      WORDPRESS_DB_HOST: ${WORDPRESS_DB_HOST}
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD}
      WORDPRESS_TABLE_PREFIX: ${WORDPRESS_TABLE_PREFIX}
    entrypoint: /bin/sh
    command:
      - -c
      - |
        while true; do
          wp cron event run --due-now --path=/var/www/html 2>&1 || true
          sleep 300
        done
    deploy:
      resources:
        limits:
          memory: 256M

  # ---------------------------------------------------------------------------
  # Cloudflare Tunnels, one per CF account
  # ---------------------------------------------------------------------------
  # Each Cloudflare account needs its own tunnel + container. A single tunnel
  # handles ALL domains on that account. Add hostnames in each account's
  # Zero Trust dashboard → Tunnels → Public Hostname → http://nginx:80
  #
  # Start all tunnels:  docker compose --profile tunnels up -d
  # ---------------------------------------------------------------------------

  # Standby tunnel, standby.example.net account (*.standby.example.net)
  cloudflared-standby.example.net:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    profiles:
      - tunnels
    networks:
      - frontend
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CF_TUNNEL_STANDBY}
    deploy:
      resources:
        limits:
          memory: 128M

  # Failover tunnels, one per CF account with real domains
  # Create a tunnel in each account, paste token in .env, uncomment below.

